# 服务器端口
server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  port: 8080
# 数据库配置
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/TakeOutxx?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update # 自动更新表结构
    show-sql: true # 打印SQL日志

# JWT配置
jwt:
  secret: NothingAccomplished13260696371snyhdaijunjie
  expiration: 3600000 # 1小时（毫秒）
