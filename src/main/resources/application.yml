server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/TakeOutxx?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  ai:
    openai:
      api-key: ${AI_API_KEY}
      base-url: https://api.deepseek.com/v4
      chat:
        model: deepseek-chat
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
      timeout: 5000ms

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000
  token-prefix: Bearer
  header: Authorization

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

role:
  redirect:
    0: /consumer/home
    1: /merchant/home
    2: /rider/home

